services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://murmur:murmur@postgres:5432/murmur
      AVCS_BASE_URL: ${AVCS_BASE_URL:-}
    ports:
      - "3400:3400"
    depends_on:
      - postgres
volumes:
  pgdata:
